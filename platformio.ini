; M5Stack AtomS3 + ATOMIC CANBus Base
; DAMIAO モーター USB シリアルコマンド テストツール

[env:m5stack-atoms3]
platform = espressif32@6.5.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified
